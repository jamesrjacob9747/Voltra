# 4 GB is plenty for this app; the template's 8 GB pushed a 16 GB laptop into heavy swapping
# alongside the emulator.
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# Plugin sources live in the C: pub cache while the build dir is on D:; Kotlin's incremental
# caches can't relativize paths across drives on Windows ("Could not close incremental caches").
kotlin.incremental=false
