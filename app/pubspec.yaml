name: voltra_app
description: "Voltra: peer-to-peer EV charging"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  flutter_map: ^8.3.2      # charger map (OpenStreetMap tiles)
  latlong2: ^0.10.1        # coordinates for flutter_map
  http: ^1.6.0             # Voltra API client
  mobile_scanner: ^7.5.0   # QR scan to start a session
  razorpay_flutter: ^1.4.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
