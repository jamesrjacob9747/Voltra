name: voltra_app
description: "Voltra: peer-to-peer EV charging"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  flutter_map: ^8.3.2      # charger map (OpenStreetMap tiles)
  latlong2: ^0.10.1        # coordinates for flutter_map
  http: ^1.6.0             # Voltra API client
  mobile_scanner: ^7.5.0   # QR scan to start a session
  razorpay_flutter: ^1.4.7
  firebase_core: ^5.1.0
  firebase_messaging: ^17.0.1
  flutter_animate: ^4.5.2
  animations: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true

  # Plus Jakarta Sans, SIL Open Font License (assets/fonts/OFL.txt). Bundled so it works offline.
  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/PlusJakartaSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/PlusJakartaSans-ExtraBold.ttf
          weight: 800
